[project]
name = "field-update-ai-agent"
version = "0.1.0"
description = "Open-source prototype: turns unstructured construction site updates into validated structured data, with human approval for every action."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "anthropic>=1.14,<2",
  "fastapi>=0.115",
  "pydantic>=2.9",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
openai = ["openai>=1.50"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "pip-audit>=2.7", "openai>=1.50"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/field_agent"]

[tool.uv]
# Only resolve releases published before this date (a supply-chain precaution).
# Moved to Oct 19 to pick up the certifi 2026.10.18 and filelock 4.2.1 security fixes.
exclude-newer = "2026-10-19T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "E501"]  # long regex patterns read better unwrapped

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"evaluation/*" = ["S"]
