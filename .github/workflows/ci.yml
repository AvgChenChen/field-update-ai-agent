name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv venv && uv pip install -e ".[dev]"
      - name: Lint and format
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
      - name: Tests (mocked LLM clients and the rule-based provider; no network, no API keys)
        run: uv run --no-sync pytest
      - name: Dependency audit
        run: uv run --no-sync pip-audit --skip-editable
      - name: Baseline evaluation (rule-based provider)
        run: |
          uv run --no-sync python evaluation/run_eval.py --provider heuristic
          uv run --no-sync python evaluation/run_eval.py --provider heuristic --dataset evaluation/holdout.jsonl

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t field-update-ai-agent:ci .
